<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mJOULE ARM Programme</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#f5f7fb; --surface:#ffffff; --surface-2:#eef1f7; --raise:#ffffff;
    --fg:#0f1426; --muted:#5c6577; --faint:#8c94a6;
    --line:#e1e6ef; --grid:#e9edf4; --band:#f7f9fc; --today:#1e3a8a; --alert:#e11d48;
    --shadow:0 1px 2px rgba(15,20,38,.05), 0 10px 30px rgba(15,20,38,.07);
    --ring:rgba(99,102,241,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#080b13; --surface:#111726; --surface-2:#0d1220; --raise:#161d2e;
      --fg:#e9edf8; --muted:#97a1b8; --faint:#6b7590;
      --line:#1f2839; --grid:#171f2e; --band:#0c111c; --today:#93b4f8; --alert:#fb7185;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 40px rgba(0,0,0,.45);
      --ring:rgba(129,140,248,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#080b13; --surface:#111726; --surface-2:#0d1220; --raise:#161d2e;
    --fg:#e9edf8; --muted:#97a1b8; --faint:#6b7590;
    --line:#1f2839; --grid:#171f2e; --band:#0c111c; --today:#93b4f8; --alert:#fb7185;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 40px rgba(0,0,0,.45);
    --ring:rgba(129,140,248,.4);
  }

  html,body{background:var(--bg); color:var(--fg);}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:content-box}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);}
  .chip{border:1px solid var(--line); background:var(--surface); color:var(--muted);
        border-radius:999px; font-size:12px; line-height:1; padding:7px 11px; white-space:nowrap;
        transition:background .15s, color .15s, border-color .15s, transform .12s; cursor:pointer; user-select:none;}
  .chip:hover{transform:translateY(-1px); color:var(--fg);}
  .chip[data-on="1"]{background:var(--fg); color:var(--bg); border-color:var(--fg);}
  .chip .dot{width:8px;height:8px;border-radius:99px;display:inline-block;margin-right:6px;vertical-align:-1px}
  .field{background:var(--surface); border:1px solid var(--line); color:var(--fg); border-radius:10px;}
  .field:focus{outline:none; box-shadow:0 0 0 3px var(--ring); border-color:transparent;}
  .field:disabled{opacity:.45; cursor:not-allowed;}

  /* Gantt frame. The frame scrolls in both axes so the header can stick to its top
     and the task column can stick to its left. */
  #frame{overflow:auto; max-height:min(92.5vh,1100px); position:relative;}
  .row{display:flex; align-items:stretch; min-width:min-content; position:relative; z-index:1;}
  .lcell{position:sticky; left:0; z-index:20; background:var(--surface);
         border-right:1px solid var(--line);
         display:flex; align-items:center; gap:10px; padding:0 14px;}
  .head{position:sticky; top:0; z-index:40; background:var(--surface); border-bottom:1px solid var(--line);}
  .head .lcell{z-index:50; background:var(--surface);}
  .track{position:relative; flex:none;}
  .grow{border-top:1px solid var(--line);}
  .grow .lcell{background:var(--surface-2);}
  .trow:hover .lcell{background:var(--surface-2);}
  .trow:hover .bar{filter:brightness(1.08);}

  .bar{position:absolute; top:50%; transform:translateY(-50%); height:20px; border-radius:7px;
       overflow:hidden; cursor:pointer; transition:box-shadow .15s, filter .15s;
       background:color-mix(in srgb, var(--c) 22%, transparent);
       border:1px solid color-mix(in srgb, var(--c) 48%, transparent);}
  .bar .fill{position:absolute; inset:0 auto 0 0; background:var(--c); opacity:.92;}
  .bar .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end;
            padding-right:7px; font-size:10px; font-weight:600; letter-spacing:.02em;
            color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5);}
  .bar.sel{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--c);}
  .bar.risk{border-color:var(--alert); border-style:dashed; border-width:1.5px;}
  .bar.done .fill{background:repeating-linear-gradient(135deg, var(--c) 0 7px,
                  color-mix(in srgb, var(--c) 68%, #ffffff) 7px 14px);}

  .gbar{position:absolute; top:50%; transform:translateY(-50%); height:12px; border-radius:4px;
        background:color-mix(in srgb, var(--c) 24%, transparent);
        border:1px solid color-mix(in srgb, var(--c) 45%, transparent);}
  .gbar .gfill{position:absolute; inset:0 auto 0 0; background:var(--c); opacity:.7; border-radius:3px;}
  .gbar::before,.gbar::after{content:""; position:absolute; top:-4px; width:2px; height:20px; background:var(--c); opacity:.85;}
  .gbar::before{left:-1px} .gbar::after{right:-1px}

  .pctOut{position:absolute; top:50%; transform:translateY(-50%); font-size:10px;
          color:var(--faint); font-weight:600; pointer-events:none;}

  .overlay{position:absolute; top:0; bottom:0; pointer-events:none; z-index:0;}
  .mline{position:absolute; top:0; bottom:0; width:1px; background:var(--line);}
  .wline{position:absolute; top:0; bottom:0; width:1px; background:var(--grid);}
  .mband{position:absolute; top:0; bottom:0; background:var(--band);}
  .qband{background:color-mix(in srgb, var(--fg) 9%, transparent);}
  .todayline{position:absolute; top:0; bottom:0; width:2px; background:var(--today); opacity:.7;}
  /* Sits below the milestone row, which centres on y=56, so the pill and a
     milestone label near today cannot paint over one another. */
  .todaytag{position:absolute; bottom:1px; transform:translateX(-50%); z-index:6; pointer-events:none;
            background:var(--today); color:#fff; font-size:10px; font-weight:700; line-height:1;
            padding:3px 6px; border-radius:4px; white-space:nowrap;}
  .msline{position:absolute; top:0; bottom:0; border-left:1px dashed color-mix(in srgb, var(--fg) 24%, transparent);}

  /* One rule for every ruler row. Each cell is left aligned on its own gridline
     with a shared 8px indent, so a year, quarter, month and week boundary that
     fall on the same day line up as a single vertical rule through the header. */
  .hcell{position:absolute; display:flex; align-items:center; padding-left:8px;
         overflow:hidden; white-space:nowrap; border-left:1px solid var(--line);
         color:var(--muted); line-height:1;}
  /* Tint the whole current cell rather than recolouring its label. A week cell
     is labelled with its first date, so colouring the text made today look like
     the 15th when it is the 16th. The band marks the column it belongs to. */
  /* Every row marks the period containing today the same way, so the eye can
     read "we are in Q3, in September, in this week" straight down the header.
     The wash lightens as the cell widens: a year-wide band at the week row's
     strength would swamp the header, while the week and day cells need enough
     tint to be seen at all. */
  .hcell.td{color:var(--today); font-weight:700;
            background:color-mix(in srgb, var(--today) 13%, transparent);
            box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--today) 30%, transparent);}
  .hyear.td{background:color-mix(in srgb, var(--today) 5%, transparent);
            box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--today) 16%, transparent);}
  .hqtr.td{background:color-mix(in srgb, var(--today) 7%, transparent);
           box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--today) 20%, transparent);}
  .hmon.td{background:color-mix(in srgb, var(--today) 10%, transparent);
           box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--today) 25%, transparent);}
  /* A week cell is labelled with its first date, so colouring that label red
     makes the 15th read as today when today is the 16th. The band already says
     today is in this column, so these rows keep their normal label colour. */
  .hwk.td, .hcell.tdfine{color:var(--muted); font-weight:500;}
  .hwk.td{background:color-mix(in srgb, var(--today) 13%, transparent);}
  .hyear{font-size:11px; font-weight:800; letter-spacing:.08em;}
  /* A year cell is far wider than the window, so its own label is off-screen for
     most of the year. This badge rides the left edge of the visible chart and is
     rewritten on scroll, so the year is readable wherever you are. A sticky
     child of .hyear cannot do this: .hcell is absolutely positioned, so sticky
     resolves against the cell, not the scrolling frame. */
  /* Matches the year row's today wash, over an opaque base so the ruler behind
     does not show through a transparent tint. It sits flush to the left edge,
     because a horizontal gap lets the year cell's own label show through beside
     it, and insets 1px top and bottom so it does not cover the row's rules. */
  .yearbadge{position:absolute; top:1px; height:18px; display:flex; align-items:center;
             padding:0 10px 0 8px; z-index:8; pointer-events:none;
             font-size:10px; font-weight:800; letter-spacing:.07em; color:var(--fg);
             background:var(--surface);}
  .yearbadge.td{color:var(--today);
                background:linear-gradient(var(--tint), var(--tint)), var(--surface);
                --tint:color-mix(in srgb, var(--today) 5%, transparent);}
  .hqtr{font-size:10px; font-weight:700; letter-spacing:.06em; color:var(--faint);}
  .hmon{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;}
  .hwk{font-size:9px; font-weight:500; color:var(--faint); border-left-color:var(--grid);
       font-variant-numeric:tabular-nums;}
  .hday{font-size:9px; font-weight:500; color:var(--faint); border-left-color:var(--grid);
        justify-content:center; padding-left:0; font-variant-numeric:tabular-nums;}
  .hday.we{background:var(--band);}
  .ms{position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; gap:5px;}
  .ms .dia{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;flex:none}
  .ms .lab{font-size:10px; font-weight:600; color:var(--muted); white-space:nowrap;}

  #tip{position:fixed; z-index:200; pointer-events:none; opacity:0; transform:translateY(4px);
       transition:opacity .12s, transform .12s; width:290px;
       background:var(--raise); border:1px solid var(--line); border-radius:12px;
       box-shadow:var(--shadow); padding:12px 13px;}
  #tip.on{opacity:1; transform:translateY(0);}

  .meter{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .meter>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--fg))}
  .mono{font-variant-numeric:tabular-nums}

  /* A stat tile that doubles as a filter shortcut. */
  .tile-btn{cursor:pointer; text-align:left; width:100%; font:inherit; color:inherit;
            transition:transform .12s, box-shadow .15s, border-color .15s;}
  .tile-btn:hover{transform:translateY(-2px); border-color:color-mix(in srgb, var(--fg) 20%, var(--line));}
  .tile-btn:focus-visible{outline:none; box-shadow:0 0 0 3px var(--ring);}
  .tile-btn[data-on="1"]{border-color:var(--alert);
                         box-shadow:0 0 0 2px color-mix(in srgb, var(--alert) 26%, transparent);}
  .tile-hint{font-size:10px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--faint);}
  .tile-btn[data-on="1"] .tile-hint{color:var(--alert);}

  @media print{
    #frame{max-height:none; overflow:visible}
    .card{box-shadow:none}
    header button, .chip{display:none}
  }
</style>
</head>
<body class="min-h-screen">

<div class="max-w-[1500px] mx-auto px-4 sm:px-6 py-6 sm:py-9">

  <header class="flex flex-wrap items-start justify-between gap-4 mb-6">
    <div>
      <div class="text-[11px] font-bold tracking-[.18em] uppercase" style="color:var(--faint)">Sciton &middot; Programme Plan</div>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mt-1">mJOULE ARM Platform</h1>
      <p class="text-sm mt-1.5" style="color:var(--muted)">Workstream schedule, ownership and progress. Hover a bar for detail, click to pin it.</p>
    </div>
    <div class="flex items-center gap-2">
      <button id="themeBtn" class="chip" title="Toggle light and dark">&#9681; Theme</button>
      <button id="printBtn" class="chip" title="Print or save as PDF">&#9113; Print</button>
    </div>
  </header>

  <section id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5"></section>

  <section class="card p-3 sm:p-4 mb-4">
    <div class="flex flex-wrap items-center gap-2.5">
      <div class="relative flex-1 min-w-[220px]">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm" style="color:var(--faint)">&#8981;</span>
        <input id="q" class="field w-full pl-8 pr-3 py-2 text-sm" placeholder="Search tasks, owners, workstreams   ( / )">
      </div>
      <select id="zoom" class="field text-sm px-3 py-2">
        <option value="week">Zoom &middot; Week</option>
        <option value="3" selected>Zoom &middot; 3 months</option>
        <option value="6">Zoom &middot; 6 months</option>
        <option value="9">Zoom &middot; 9 months</option>
        <option value="12">Zoom &middot; 12 months</option>
      </select>
      <select id="sort" class="field text-sm px-3 py-2">
        <option value="plan">Sort &middot; Plan order</option>
        <option value="start">Sort &middot; Start date</option>
        <option value="end">Sort &middot; Finish date</option>
        <option value="prog">Sort &middot; Progress</option>
      </select>
      <button id="collapseBtn" class="chip">&#8661; Collapse all</button>
      <button id="todayBtn" class="chip">&#9678; Today</button>
      <button id="resetBtn" class="chip">&#8635; Reset</button>
    </div>

    <div class="mt-3 pt-3 flex flex-wrap items-center gap-2" style="border-top:1px solid var(--line)">
      <span class="text-[11px] font-semibold uppercase tracking-wider w-16" style="color:var(--faint)">Stream</span>
      <div id="wsChips" class="flex flex-wrap gap-2 flex-1"></div>
    </div>
    <div class="mt-2.5 flex flex-wrap items-center gap-2">
      <span class="text-[11px] font-semibold uppercase tracking-wider w-16" style="color:var(--faint)">Owner</span>
      <div id="ownChips" class="flex flex-wrap gap-2 flex-1"></div>
    </div>
    <div class="mt-2.5 flex flex-wrap items-center gap-2">
      <span class="text-[11px] font-semibold uppercase tracking-wider w-16" style="color:var(--faint)">Status</span>
      <div id="stChips" class="flex flex-wrap gap-2 flex-1"></div>
    </div>
  </section>

  <section class="card overflow-hidden">
    <div id="frame"></div>
  </section>

  <section id="detail" class="card p-4 mt-4 hidden"></section>

  <footer class="mt-5 flex flex-wrap items-center justify-between gap-3 text-xs" style="color:var(--faint)">
    <div class="mono" id="stamp"></div>
  </footer>
</div>

<div id="tip"></div>

<!-- The plan itself lives in mjoule-arm-plan.js and defines the global PROJECT.
     Keep it as a plain script so the page still opens straight from disk. -->
<script src="mjoule-arm-plan.js"></script>
<script>
/* The data file is the only hard dependency. If it is missing or fails to
   parse, say so in the page rather than dying with a bare ReferenceError. */
if (typeof PROJECT === 'undefined') {
  document.body.innerHTML = '<div style="font:14px/1.6 system-ui;padding:40px;max-width:44rem">' +
    '<h1 style="font-size:20px;font-weight:600;margin:0 0 12px">Plan data not loaded</h1>' +
    '<p style="margin:0 0 8px">This page expects <code>mjoule-arm-plan.js</code> to sit alongside it ' +
    'and to define a global <code>PROJECT</code> object.</p>' +
    '<p style="margin:0">Check the file is present and that it parses (the browser console will ' +
    'name the line if it does not).</p></div>';
  throw new Error('mjoule-arm-plan.js did not define PROJECT');
}
/* ---- date helpers. Everything is UTC midnight so the chart cannot drift by
   a day when the browser sits in a negative offset zone. ---- */
const DAY = 86400000;
const d2ms = s => { const p = s.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); };
const ms2d = ms => new Date(ms);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['S','M','T','W','T','F','S'];
const fmt = ms => { const d = ms2d(ms); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
const fmtShort = ms => { const d = ms2d(ms); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; };
const todayMs = (function(){ const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); })();

const P0 = d2ms(PROJECT.start), P1 = d2ms(PROJECT.finish);
const TOTAL_DAYS = Math.round((P1 - P0) / DAY) + 1;

/* ---- derived model ---- */
let UID = 0;
const WS = PROJECT.workstreams.map(function(w){
  const tasks = w.tasks.map(function(t){
    const s = d2ms(t.start), e = d2ms(t.end);
    const days = Math.round((e - s) / DAY) + 1;
    const status = t.progress >= 100 ? 'done' : (t.progress > 0 ? 'active' : 'planned');
    const overdue = t.progress < 100 && e < todayMs;
    return Object.assign({}, t, { uid:'t' + (UID++), wsId:w.id, wsName:w.name, colour:w.colour,
                                  owners:w.owners, s:s, e:e, days:days, status:status,
                                  overdue:overdue, risk:!!t.risk });
  });
  const wd = tasks.reduce(function(a,t){ return a + t.days; }, 0);
  return Object.assign({}, w, {
    tasks: tasks,
    s: Math.min.apply(null, tasks.map(function(t){ return t.s; })),
    e: Math.max.apply(null, tasks.map(function(t){ return t.e; })),
    progress: Math.round(tasks.reduce(function(a,t){ return a + t.days * t.progress; }, 0) / wd)
  });
});

const OWNERS = Array.from(new Set(WS.reduce(function(a,w){ return a.concat(w.owners); }, [])));
const STATUSES = [
  { id:'planned', label:'Not started' },
  { id:'active',  label:'In progress' },
  { id:'done',    label:'Complete' },
  { id:'risk',    label:'At risk' },
  { id:'overdue', label:'Overdue' }
];
const ALL_TASKS = WS.reduce(function(a,w){ return a.concat(w.tasks); }, []);

/* ---- ui state ---- */
const state = {
  q:'', dayW:11, zoom:'3', sort:'plan',
  ws:new Set(), own:new Set(), st:new Set(),
  collapsed:new Set(), selected:null
};
const LEFT_W = 330;
const el = function(id){ return document.getElementById(id); };
const esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){
  return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]; }); };

function matches(t){
  if (state.ws.size && !state.ws.has(t.wsId)) return false;
  if (state.own.size && !t.owners.some(function(o){ return state.own.has(o); })) return false;
  if (state.st.size){
    const tags = [t.status];
    if (t.risk) tags.push('risk');
    if (t.overdue) tags.push('overdue');
    if (!tags.some(function(x){ return state.st.has(x); })) return false;
  }
  if (state.q){
    const hay = (t.name + ' ' + t.wsName + ' ' + t.owners.join(' ')).toLowerCase();
    if (hay.indexOf(state.q) === -1) return false;
  }
  return true;
}

function sortTasks(list){
  const c = list.slice();
  if (state.sort === 'start') c.sort(function(a,b){ return a.s - b.s; });
  else if (state.sort === 'end') c.sort(function(a,b){ return a.e - b.e; });
  else if (state.sort === 'prog') c.sort(function(a,b){ return b.progress - a.progress || a.s - b.s; });
  return c;
}

/* ---- filter chips ---- */
function buildChips(){
  el('wsChips').innerHTML = WS.map(function(w){
    return '<button class="chip" data-kind="ws" data-v="' + w.id + '">' +
           '<span class="dot" style="background:' + w.colour + '"></span>' + esc(w.name) + '</button>';
  }).join('');
  el('ownChips').innerHTML = OWNERS.map(function(o){
    return '<button class="chip" data-kind="own" data-v="' + esc(o) + '">' + esc(o) + '</button>';
  }).join('');
  el('stChips').innerHTML = STATUSES.map(function(s){
    return '<button class="chip" data-kind="st" data-v="' + s.id + '">' + s.label + '</button>';
  }).join('');

  Array.prototype.forEach.call(document.querySelectorAll('.chip[data-kind]'), function(b){
    b.addEventListener('click', function(){
      const set = state[b.dataset.kind];
      if (set.has(b.dataset.v)) set.delete(b.dataset.v); else set.add(b.dataset.v);
      syncChips();
      renderStats();   /* keeps the "Needs attention" tile in step with the status chips */
      render();
    });
  });
}
function syncChips(){
  Array.prototype.forEach.call(document.querySelectorAll('.chip[data-kind]'), function(b){
    b.dataset.on = state[b.dataset.kind].has(b.dataset.v) ? '1' : '0';
  });
}

/* ---- stat tiles ----
   The "Needs attention" tile is also the shortcut for the at-risk and overdue
   filters. It is a toggle, so a second click restores the full plan. */
const ATTN = ['risk','overdue'];
function attnActive(){
  return state.st.size === ATTN.length && ATTN.every(function(x){ return state.st.has(x); });
}
function toggleAttention(){
  const on = attnActive();
  state.st.clear();
  if (!on) ATTN.forEach(function(x){ state.st.add(x); });
  /* Expand every group, otherwise a collapsed stream hides its own flagged tasks. */
  state.collapsed.clear();
  el('collapseBtn').innerHTML = '&#8661; Collapse all';
  syncChips();
  renderStats();
  render();
  if (!on) el('frame').scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function renderStats(){
  const wd = ALL_TASKS.reduce(function(a,t){ return a + t.days; }, 0);
  const prog = Math.round(ALL_TASKS.reduce(function(a,t){ return a + t.days * t.progress; }, 0) / wd);
  const flagged = ALL_TASKS.filter(function(t){ return t.risk || t.overdue; });
  const nRisk = flagged.filter(function(t){ return t.risk; }).length;
  const nLate = flagged.filter(function(t){ return t.overdue; }).length;
  const done = ALL_TASKS.filter(function(t){ return t.status === 'done'; }).length;
  const toGo = Math.max(0, Math.round((P1 - todayMs) / DAY));
  const on = attnActive();
  const tiles = [
    { k:'Overall progress', v:prog + '%', s:done + ' of ' + ALL_TASKS.length + ' tasks complete', meter:prog, c:'#6366f1' },
    { k:'Workstreams',      v:WS.length,  s:OWNERS.length + ' owners assigned' },
    { k:'Needs attention',  v:flagged.length, c:'#f43f5e', action:'attn', on:on,
      s:nRisk + ' at risk, ' + nLate + ' past due',
      hint: on ? 'Filtered &middot; click to clear' : 'Click to focus' },
    { k:'Days to release',  v:toGo,       s:fmt(P1) }
  ];
  el('stats').innerHTML = tiles.map(function(t){
    const tag = t.action ? 'button' : 'div';
    const cls = 'card p-4' + (t.action ? ' tile-btn' : '');
    const attr = t.action ? ' type="button" data-tile="' + t.action + '" data-on="' + (t.on ? '1' : '0') +
                            '" title="Show only the tasks flagged at risk or past due"' : '';
    return '<' + tag + ' class="' + cls + '"' + attr + '>' +
      '<div class="flex items-start justify-between gap-2">' +
        '<div class="text-[11px] font-semibold uppercase tracking-wider" style="color:var(--faint)">' + t.k + '</div>' +
        (t.hint ? '<div class="tile-hint">' + t.hint + '</div>' : '') +
      '</div>' +
      '<div class="text-3xl font-bold mt-1.5 mono"' + (t.c ? ' style="color:' + t.c + '"' : '') + '>' + t.v + '</div>' +
      '<div class="text-xs mt-1" style="color:var(--muted)">' + t.s + '</div>' +
      (t.meter != null ? '<div class="meter mt-2.5" style="--c:' + t.c + '"><i style="width:' + t.meter + '%"></i></div>' : '') +
      '</' + tag + '>';
  }).join('');

  const attnTile = el('stats').querySelector('[data-tile="attn"]');
  if (attnTile) attnTile.addEventListener('click', toggleAttention);

  el('stamp').textContent = 'Plan window ' + fmt(P0) + ' to ' + fmt(P1) + '  |  today ' + fmt(todayMs);
}

/* ---- geometry ---- */
const xOf = function(ms){ return Math.round((ms - P0) / DAY * state.dayW); };
const wOf = function(s,e){ return Math.max(3, xOf(e + DAY) - xOf(s)); };
/* Pixels per day for the current zoom. Every setting fits a span of time to the
   visible width, so the label always describes what you actually get. 'week' is
   the granular end: it fits about a month of days, which lands near 35px per day
   and is wide enough for a day-by-day row without leaving the screen showing
   only a handful of days. A month is taken as 30.44 days (the mean), so the fit
   is approximate and the view shows the requested span plus whatever the window
   has room for. */
const ZOOM_MONTHS = { week: 1, '3': 3, '6': 6, '9': 9, '12': 12 };

function fitDayW(){
  const f = el('frame');
  const avail = (f ? f.clientWidth : 0) - LEFT_W;
  const months = ZOOM_MONTHS[state.zoom] || 3;
  if (avail < 120) return state.dayW;
  return Math.max(2, avail / (months * 30.44));
}

/* Called before every render so the scale survives a window resize as well as a
   change of control. */
function applyZoom(){
  state.dayW = fitDayW();
}

/* x of the middle of today's column. xOf gives the left edge of a day, which is
   midnight at its start, so the bare value draws the rule on the boundary
   between yesterday and today rather than through the day it names. */
const xToday = function(){ return xOf(todayMs) + state.dayW / 2; };
const monthStart = function(ms){ const d = ms2d(ms); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1); };
const nextMonth = function(ms){ const d = ms2d(ms); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1); };
/* One generator for all four header rows. Each returns [{s, e, label}] with
   inclusive bounds clipped to the plan window, so a single band builder can
   draw any row and the rows cannot drift out of step with one another.

   Weeks restart at every month on days 1, 8, 15, 22 and 29 rather than running
   continuously on Mondays. Anchoring to the month is what keeps the rows
   aligned: the first tick of a month shares its x with the month, quarter and
   year boundaries above it. The cost is that a week column is a span of dates,
   not a calendar week. */
const periods = {
  year: function(){
    const out = [];
    for (let y = ms2d(P0).getUTCFullYear(); y <= ms2d(P1).getUTCFullYear(); y++){
      const s = Date.UTC(y, 0, 1), e = Date.UTC(y, 11, 31);
      if (e < P0 || s > P1) continue;
      out.push({ s: Math.max(s, P0), e: Math.min(e, P1), label: String(y) });
    }
    return out;
  },
  quarter: function(){
    const out = [];
    let cur = Date.UTC(ms2d(P0).getUTCFullYear(), Math.floor(ms2d(P0).getUTCMonth() / 3) * 3, 1);
    while (cur <= P1){
      const d = ms2d(cur), nxt = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 3, 1);
      const s = cur, e = nxt - DAY;
      if (e >= P0) out.push({ s: Math.max(s, P0), e: Math.min(e, P1),
                              label: 'Q' + (Math.floor(d.getUTCMonth() / 3) + 1) });
      cur = nxt;
    }
    return out;
  },
  month: function(){
    const out = [];
    for (let cur = monthStart(P0); cur <= P1; cur = nextMonth(cur)){
      const d = ms2d(cur), e = nextMonth(cur) - DAY;
      if (e < P0) continue;
      out.push({ s: Math.max(cur, P0), e: Math.min(e, P1), label: MON[d.getUTCMonth()] });
    }
    return out;
  },
  day: function(){
    const out = [];
    for (let ms = P0; ms <= P1; ms += DAY){
      const d = ms2d(ms);
      out.push({ s: ms, e: ms, label: DOW[d.getUTCDay()] + ' ' + d.getUTCDate(),
                 we: d.getUTCDay() === 0 || d.getUTCDay() === 6 });
    }
    return out;
  },
  week: function(){
    const out = [];
    for (let cur = monthStart(P0); cur <= P1; cur = nextMonth(cur)){
      const last = nextMonth(cur) - DAY;
      for (let i = 0; i < 5; i++){
        const s = cur + i * 7 * DAY;
        if (s > last) break;
        const e = Math.min(i === 4 ? last : s + 6 * DAY, last);
        if (e < P0 || s > P1) continue;
        out.push({ s: Math.max(s, P0), e: Math.min(e, P1),
                   label: String(ms2d(Math.max(s, P0)).getUTCDate()) });
      }
    }
    return out;
  }
};

/* The four ruler rows, coarsest first. Each is drawn by the same band builder
   from periods[], so they share one set of boundaries and cannot drift apart.
   minW is the width below which a cell keeps its gridline but drops its label,
   which is what lets the week row degrade gracefully at low density instead of
   overprinting itself. */
const HEAD_ROWS = [
  { key:'year',    top:0,  h:20, minW:40, cls:'hcell hyear' },
  { key:'quarter', top:20, h:18, minW:28, cls:'hcell hqtr' },
  { key:'month',   top:38, h:18, minW:34, cls:'hcell hmon' },
  { key:'week',    top:56, h:18, minW:26, cls:'hcell hwk' },
  /* Only drawn at the week zoom, where a day is wide enough to label. */
  { key:'day',     top:74, h:20, minW:14, cls:'hcell hday', weekOnly:true }
];
/* The day row's slot is reserved whether or not it is drawn, so the header is
   always the same height. Letting it grow only at the week zoom shifted the
   milestone row, the today pill and every task row below it, which read as the
   chart jumping about when all that changed was the scale. */
const headRows = function(){ return HEAD_ROWS.filter(function(r){ return !r.weekOnly || state.zoom === 'week'; }); };
const RULER_H = HEAD_ROWS[HEAD_ROWS.length - 1].top + HEAD_ROWS[HEAD_ROWS.length - 1].h;
const headH = function(){ return RULER_H + 38; };

function headerHTML(TW){
  let rows = '', bands = '';

  /* Alternating stripes on two levels. Each stripe is confined to its own row:
     a quarter stripe reaching up into the year row would look like the year
     itself was highlighted, since the block would start at the quarter boundary
     rather than in January. */
  const rulerH = RULER_H;
  periods.quarter().forEach(function(pd, i){
    if (i % 2) bands += '<div class="mband qband" style="left:' + xOf(pd.s) + 'px;width:' +
                        wOf(pd.s, pd.e) + 'px;top:' + HEAD_ROWS[1].top + 'px;bottom:auto;height:' +
                        HEAD_ROWS[1].h + 'px"></div>';
  });
  periods.month().forEach(function(pd, i){
    if (i % 2) bands += '<div class="mband" style="left:' + xOf(pd.s) + 'px;width:' +
                        wOf(pd.s, pd.e) + 'px;top:' + HEAD_ROWS[2].top + 'px;bottom:auto;height:' +
                        (rulerH - HEAD_ROWS[2].top) + 'px"></div>';
  });

  const rws = headRows(), finest = rws[rws.length - 1].key;
  rws.forEach(function(r){
    periods[r.key]().forEach(function(pd){
      const w = wOf(pd.s, pd.e);
      const hit = todayMs >= pd.s && todayMs <= pd.e;
      /* The finest row stretches into the reserved day slot when the day row is
         not drawn, so the header is fully used at every zoom without changing
         height. */
      const h = r.key === finest ? RULER_H - r.top : r.h;
      rows += '<div class="' + r.cls + (hit ? (r.key === finest ? ' td tdfine' : ' td') : '') + (pd.we ? ' we' : '') +
              '" style="left:' + xOf(pd.s) + 'px;width:' + w + 'px;top:' + r.top +
              'px;height:' + h + 'px">' +
              (w > r.minW ? '<span>' + pd.label + '</span>' : '') + '</div>';
    });
  });

  /* Dated caption for the today rule. It lives in the sticky header so it stays
     visible while the chart scrolls and cannot be covered by task rows. */
  const todayTag = (todayMs >= P0 && todayMs <= P1)
    ? '<div class="todaytag" style="left:' + xToday() + 'px">' + fmt(todayMs) + '</div>'
    : '';

  const msTop = RULER_H + 9;
  const msMarks = PROJECT.milestones.map(function(m){
    const ms = d2ms(m.date), x = xOf(ms), flip = x > TW - 130;
    const fill = ms <= todayMs ? 'var(--fg)' : 'var(--faint)';
    return '<div class="ms" style="top:' + msTop + 'px;left:' + x + 'px;' +
           (flip ? 'transform:translate(-100%,-50%);flex-direction:row-reverse;' : '') + '">' +
           '<span class="dia" style="background:' + fill + '"></span>' +
           '<span class="lab">' + esc(m.label) + '</span></div>';
  }).join('');

  return '<div class="row head">' +
    '<div class="lcell" style="width:' + LEFT_W + 'px;flex:none;height:' + headH() + 'px">' +
      '<div><div class="text-[11px] font-bold uppercase tracking-[.14em]" style="color:var(--faint)">Workstream</div>' +
      '<div class="text-sm font-semibold mt-0.5">Task and owner</div></div>' +
    '</div>' +
    '<div class="track" style="width:' + TW + 'px;height:' + headH() + 'px">' +
      bands + rows + msMarks + todayTag +
      '<div class="yearbadge" id="yearBadge" style="left:0px"></div></div>' +
  '</div>';
}

function overlayHTML(TW){
  let out = '';
  let cur = monthStart(P0), i = 0;
  while (cur <= P1){
    const nxt = nextMonth(cur);
    const a = Math.max(cur, P0), b = Math.min(nxt - DAY, P1);
    const x = xOf(a), w = wOf(a, b);
    if (i % 2) out += '<div class="mband" style="left:' + x + 'px;width:' + w + 'px"></div>';
    out += '<div class="mline" style="left:' + x + 'px"></div>';
    cur = nxt; i++;
  }
  /* Match the finest ruler row, so a gridline always has a label above it. At
     the 12 month zoom the week row is unlabelled anyway and its lines collapse
     into noise, so the month rules carry the grid on their own. */
  if (state.zoom !== '12'){
    periods[state.zoom === 'week' ? 'day' : 'week']().forEach(function(pd){
      out += '<div class="wline" style="left:' + xOf(pd.s) + 'px"></div>'; });
  }
  out += PROJECT.milestones.map(function(m){
    return '<div class="msline" style="left:' + xOf(d2ms(m.date)) + 'px"></div>';
  }).join('');
  if (todayMs >= P0 && todayMs <= P1) out += '<div class="todayline" style="left:' + xToday() + 'px"></div>';
  return '<div class="overlay" style="left:' + LEFT_W + 'px;width:' + TW + 'px">' + out + '</div>';
}

function avatars(owners){
  return owners.map(function(o){
    return '<span class="inline-flex items-center justify-center w-5 h-5 rounded-full text-[9px] font-bold" ' +
      'style="background:var(--surface);color:var(--muted);border:1px solid var(--line)" title="' + esc(o) + '">' +
      esc(o.slice(0,2)) + '</span>';
  }).join('');
}

function barHTML(t, TW){
  const x = xOf(t.s), w = wOf(t.s, t.e);
  const cls = ['bar', t.status === 'done' ? 'done' : '', (t.risk || t.overdue) ? 'risk' : '',
               state.selected === t.uid ? 'sel' : ''].filter(Boolean).join(' ');
  let html = '<div class="' + cls + '" data-uid="' + t.uid + '" style="--c:' + t.colour +
             ';left:' + x + 'px;width:' + w + 'px">' +
             '<span class="fill" style="width:' + t.progress + '%"></span>' +
             (w >= 46 ? '<span class="pct">' + t.progress + '%</span>' : '') +
             '</div>';
  if (w < 46){
    html += '<span class="pctOut" style="left:' + Math.min(x + w + 6, TW - 26) + 'px">' + t.progress + '%</span>';
  }
  return html;
}

function render(){
  applyZoom();
  const TW = TOTAL_DAYS * state.dayW;
  let rows = '', shown = 0;

  WS.forEach(function(w){
    const visible = sortTasks(w.tasks.filter(matches));
    if (!visible.length) return;
    shown += visible.length;
    const isCol = state.collapsed.has(w.id);
    const gs = Math.min.apply(null, visible.map(function(t){ return t.s; }));
    const ge = Math.max.apply(null, visible.map(function(t){ return t.e; }));
    const gd = visible.reduce(function(a,t){ return a + t.days; }, 0);
    const gp = Math.round(visible.reduce(function(a,t){ return a + t.days * t.progress; }, 0) / gd);

    rows += '<div class="row grow" data-ws="' + w.id + '" style="height:52px;cursor:pointer">' +
      '<div class="lcell" style="width:' + LEFT_W + 'px;flex:none">' +
        '<span class="text-xs w-3 flex-none" style="color:var(--faint)">' + (isCol ? '&#9656;' : '&#9662;') + '</span>' +
        '<span class="w-1.5 h-7 rounded-full flex-none" style="background:' + w.colour + '"></span>' +
        '<span class="min-w-0 flex-1">' +
          '<span class="block text-[13px] font-semibold truncate">' + esc(w.name) + '</span>' +
          '<span class="block text-[11px] truncate" style="color:var(--muted)">' +
            esc(w.owners.join(', ')) + ' &middot; ' + visible.length + ' tasks &middot; ' + gp + '%</span>' +
        '</span>' +
        '<span class="flex gap-1 flex-none">' + avatars(w.owners) + '</span>' +
      '</div>' +
      '<div class="track" style="width:' + TW + 'px">' +
        '<div class="gbar" style="--c:' + w.colour + ';left:' + xOf(gs) + 'px;width:' + wOf(gs, ge) + 'px">' +
          '<span class="gfill" style="width:' + gp + '%"></span></div>' +
      '</div>' +
    '</div>';

    if (isCol) return;

    visible.forEach(function(t){
      rows += '<div class="row trow" style="min-height:40px;border-top:1px solid var(--grid)">' +
        '<div class="lcell" style="width:' + LEFT_W + 'px;flex:none;padding-top:5px;padding-bottom:5px">' +
          '<span class="w-3 flex-none"></span>' +
          '<span class="min-w-0 flex-1">' +
            '<span class="block text-[12.5px] leading-snug break-words" title="' + esc(t.name) + '">' + esc(t.name) +
              (t.risk ? ' <span style="color:var(--alert)" title="At risk">&#9679;</span>' : '') +
              (t.overdue ? ' <span style="color:var(--alert)" title="Past due">&#9650;</span>' : '') +
            '</span>' +
            '<span class="block text-[10.5px] mono truncate" style="color:var(--faint)">' +
              fmtShort(t.s) + ' &ndash; ' + fmtShort(t.e) + ' &middot; ' + t.days + 'd</span>' +
          '</span>' +
          '<span class="w-9 flex-none text-right text-[11px] mono font-semibold" style="color:var(--muted)">' + t.progress + '%</span>' +
        '</div>' +
        '<div class="track" style="width:' + TW + 'px">' + barHTML(t, TW) + '</div>' +
      '</div>';
    });
  });

  if (!shown){
    rows = '<div class="p-14 text-center text-sm" style="color:var(--muted)">' +
           'No tasks match the current filters. <button id="clr" class="underline">Clear them</button>.</div>';
  }

  el('frame').innerHTML = headerHTML(TW) +
    '<div style="position:relative;min-width:min-content">' + overlayHTML(TW) + rows + '</div>';

  Array.prototype.forEach.call(el('frame').querySelectorAll('.row.grow'), function(r){
    r.addEventListener('click', function(){
      const id = r.dataset.ws;
      if (state.collapsed.has(id)) state.collapsed.delete(id); else state.collapsed.add(id);
      const sl = el('frame').scrollLeft, st = el('frame').scrollTop;
      render();
      el('frame').scrollLeft = sl;
      el('frame').scrollTop = st;
    });
  });

  Array.prototype.forEach.call(el('frame').querySelectorAll('.bar'), function(b){
    const t = ALL_TASKS.filter(function(x){ return x.uid === b.dataset.uid; })[0];
    b.addEventListener('mousemove', function(e){ showTip(e, t); });
    b.addEventListener('mouseleave', hideTip);
    b.addEventListener('click', function(e){ e.stopPropagation(); hideTip(); select(t); });
  });

  const clr = el('clr');
  if (clr) clr.addEventListener('click', resetFilters);

  syncYearBadge();
}

/* ---- hover tooltip ---- */
const tip = el('tip');
function burn(t){
  /* Percentage of the task window that has elapsed, clamped to the window. */
  if (todayMs < t.s) return 0;
  if (todayMs > t.e) return 100;
  return Math.round((Math.round((todayMs - t.s) / DAY) + 1) / t.days * 100);
}
function showTip(e, t){
  const expected = burn(t), drift = t.progress - expected;
  const driftText = drift < -10 ? 'Behind the expected burn by ' + Math.abs(drift) + ' points'
                  : drift > 10 ? 'Ahead of the expected burn by ' + drift + ' points'
                  : 'Tracking to plan';
  tip.innerHTML =
    '<div class="flex items-start gap-2">' +
      '<span class="w-2 h-2 rounded-full mt-1.5 flex-none" style="background:' + t.colour + '"></span>' +
      '<div class="min-w-0">' +
        '<div class="text-[13px] font-semibold leading-snug">' + esc(t.name) + '</div>' +
        '<div class="text-[11px] mt-0.5" style="color:var(--muted)">' + esc(t.wsName) + ' &middot; ' + esc(t.owners.join(', ')) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="mt-2.5 grid grid-cols-2 gap-x-3 gap-y-1 text-[11px]" style="color:var(--muted)">' +
      '<div>Start</div><div class="mono text-right" style="color:var(--fg)">' + fmt(t.s) + '</div>' +
      '<div>Finish</div><div class="mono text-right" style="color:var(--fg)">' + fmt(t.e) + '</div>' +
      '<div>Duration</div><div class="mono text-right" style="color:var(--fg)">' + t.days + ' days</div>' +
      '<div>Elapsed window</div><div class="mono text-right" style="color:var(--fg)">' + expected + '%</div>' +
    '</div>' +
    '<div class="mt-2.5">' +
      '<div class="flex items-center justify-between text-[11px] mb-1">' +
        '<span style="color:var(--muted)">Progress</span>' +
        '<span class="mono font-semibold">' + t.progress + '%</span></div>' +
      '<div class="meter" style="--c:' + t.colour + '"><i style="width:' + t.progress + '%"></i></div>' +
    '</div>' +
    (t.progress < 100 ? '<div class="mt-2 text-[11px] font-semibold" style="color:' +
        (drift < -10 ? 'var(--alert)' : 'var(--muted)') + '">' + driftText + '</div>' : '') +
    (t.risk ? '<div class="mt-2 text-[11px]" style="color:var(--alert)">At risk &middot; ' + esc(t.note || 'flagged for review') + '</div>' : '') +
    (t.overdue ? '<div class="mt-1 text-[11px]" style="color:var(--alert)">Past its planned finish</div>' : '');

  tip.classList.add('on');
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 16, y = e.clientY + 16;
  if (x + r.width > window.innerWidth - 12) x = e.clientX - r.width - 16;
  if (y + r.height > window.innerHeight - 12) y = window.innerHeight - r.height - 12;
  tip.style.left = Math.max(12, x) + 'px';
  tip.style.top = Math.max(12, y) + 'px';
}
function hideTip(){ tip.classList.remove('on'); }

/* ---- pinned detail panel ---- */
function select(t){
  state.selected = (state.selected === t.uid) ? null : t.uid;
  const p = el('detail');
  if (!state.selected){ p.classList.add('hidden'); render(); return; }
  p.classList.remove('hidden');
  p.innerHTML =
    '<div class="flex flex-wrap items-start justify-between gap-5">' +
      '<div class="min-w-0">' +
        '<div class="flex items-center gap-2">' +
          '<span class="w-2.5 h-2.5 rounded-full" style="background:' + t.colour + '"></span>' +
          '<span class="text-[11px] font-semibold uppercase tracking-wider" style="color:var(--faint)">' + esc(t.wsName) + '</span>' +
        '</div>' +
        '<h2 class="text-lg font-semibold mt-1">' + esc(t.name) + '</h2>' +
        '<p class="text-xs mt-1" style="color:var(--muted)">' + esc(t.owners.join(', ')) + ' &middot; ' +
          fmt(t.s) + ' to ' + fmt(t.e) + ' &middot; ' + t.days + ' days' +
          (t.risk ? ' &middot; <span style="color:var(--alert)">at risk</span>' : '') + '</p>' +
        (t.note ? '<p class="text-xs mt-2 max-w-xl" style="color:var(--muted)">' + esc(t.note) + '</p>' : '') +
      '</div>' +
      '<div class="w-56">' +
        '<div class="flex items-center justify-between text-xs mb-1">' +
          '<span style="color:var(--muted)">Progress</span><span class="mono font-semibold">' + t.progress + '%</span></div>' +
        '<div class="meter" style="--c:' + t.colour + ';height:8px"><i style="width:' + t.progress + '%"></i></div>' +
        '<button id="closeDet" class="chip mt-3 w-full text-center">Close</button>' +
      '</div>' +
    '</div>';
  render();
  const c = el('closeDet');
  if (c) c.addEventListener('click', function(){
    state.selected = null;
    p.classList.add('hidden');
    render();
  });
}

/* ---- controls ---- */
function scrollToToday(smooth){
  const f = el('frame');
  f.scrollTo({ left: Math.max(0, xToday() - f.clientWidth * 0.3), behavior: smooth ? 'smooth' : 'auto' });
}
function resetFilters(){
  state.q = '';
  el('q').value = '';
  state.ws.clear(); state.own.clear(); state.st.clear();
  state.collapsed = new Set(WS.map(function(w){ return w.id; }));
  state.selected = null;
  el('detail').classList.add('hidden');
  el('collapseBtn').innerHTML = '&#8661; Expand all';
  syncChips();
  renderStats();
  render();
}

el('q').addEventListener('input', function(e){ state.q = e.target.value.trim().toLowerCase(); render(); });
el('zoom').addEventListener('change', function(e){
  state.zoom = e.target.value;
  render(); scrollToToday(false);
});
/* The scale is fitted to the window, so it has to be recomputed when the window
   changes size or the chosen span stops being the span you actually see. */
addEventListener('resize', function(){ render(); });

/* Park the year badge at the left edge of the visible chart and name whichever
   year is under it, so a zoomed-in view away from a year boundary still says
   which year it is showing. */
function syncYearBadge(){
  const b = el('yearBadge'), f = el('frame');
  if (!b || !f) return;
  const x = f.scrollLeft;
  b.style.left = x + 'px';
  const ms = P0 + Math.round(x / state.dayW) * DAY;
  const year = ms2d(Math.min(Math.max(ms, P0), P1)).getUTCFullYear();
  b.textContent = year;
  /* Carry the today wash only on the year that actually contains today, so the
     badge matches the year row underneath it instead of tinting every year. */
  b.classList.toggle('td', year === ms2d(todayMs).getUTCFullYear());
}

el('sort').addEventListener('change', function(e){ state.sort = e.target.value; render(); });
el('todayBtn').addEventListener('click', function(){ scrollToToday(true); });
el('resetBtn').addEventListener('click', resetFilters);
el('collapseBtn').addEventListener('click', function(){
  const allCollapsed = state.collapsed.size === WS.length;
  state.collapsed = allCollapsed ? new Set() : new Set(WS.map(function(w){ return w.id; }));
  el('collapseBtn').innerHTML = allCollapsed ? '&#8661; Collapse all' : '&#8661; Expand all';
  render();
});
el('printBtn').addEventListener('click', function(){ window.print(); });
el('themeBtn').addEventListener('click', function(){
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur ? (cur === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('gantt-theme', next); } catch (err) { /* private mode, ignore */ }
});
window.addEventListener('keydown', function(e){
  if (e.key === '/' && document.activeElement !== el('q')){ e.preventDefault(); el('q').focus(); }
  if (e.key === 'Escape'){ el('q').blur(); hideTip(); }
});

try {
  const saved = localStorage.getItem('gantt-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
} catch (err) { /* storage can be blocked, the media query still applies */ }

/* Open on the roll-up view: every stream collapsed to its summary bar, which
   fits the whole programme on screen without scrolling. Expand a stream, or hit
   Expand all, to see individual tasks. */
state.collapsed = new Set(WS.map(function(w){ return w.id; }));
el('collapseBtn').innerHTML = '&#8661; Expand all';

buildChips();
syncChips();
renderStats();
render();
scrollToToday(false);
el('frame').addEventListener('scroll', syncYearBadge, { passive:true });

/* Ctrl or Cmd with the wheel steps through the zoom levels, the convention every
   map and drawing tool uses. The date under the pointer is held still across the
   change, so zooming in on a task keeps that task under the cursor rather than
   throwing you back to the plan start. Without the modifier the wheel scrolls
   normally, so the page still behaves for anyone not reaching for zoom. */
const ZOOM_ORDER = ['week', '3', '6', '9', '12'];
el('frame').addEventListener('wheel', function(e){
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  const i = ZOOM_ORDER.indexOf(state.zoom);
  if (i < 0) return;
  /* Wheel down (positive deltaY) zooms out, matching the scroll-to-shrink
     convention. clamp rather than wrap, so the ends are stable. */
  const next = Math.min(ZOOM_ORDER.length - 1, Math.max(0, i + (e.deltaY > 0 ? 1 : -1)));
  if (next === i) return;

  const f = el('frame');
  const anchor = e.clientX - f.getBoundingClientRect().left - LEFT_W;
  /* Day under the pointer before the scale changes. Guard the case where the
     pointer is over the frozen left column, where there is no date to hold. */
  const dayAt = anchor >= 0 ? (f.scrollLeft + anchor) / state.dayW : null;

  state.zoom = ZOOM_ORDER[next];
  el('zoom').value = state.zoom;
  render();

  if (dayAt !== null) f.scrollLeft = Math.max(0, dayAt * state.dayW - anchor);
  syncYearBadge();
}, { passive:false });
syncYearBadge();
</script>
</body>
</html>
